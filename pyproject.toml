[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse"
version = "1.1.0"
description = "Synapse — Hybrid Knowledge Framework (dense vectors + FTS5 keyword search, RRF fusion)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "doctorboyz" },
]
keywords = ["knowledge", "search", "hybrid", "lancedb", "sqlite", "fts5", "embedding", "vector"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "lancedb>=0.6.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
bench = [
    "rich>=13.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
synapse = "synapse.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]