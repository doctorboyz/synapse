<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="axonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="dendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="vesicleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="receptorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Grid pattern (subtle) -->
  <g opacity="0.04" stroke="#6366f1" stroke-width="0.5">
    <line x1="0" y1="0" x2="800" y2="0" y2="500"/>
    <!-- horizontal lines -->
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
  </g>

  <!-- ===== AXON (coming from left) ===== -->
  <!-- Axon shaft -->
  <path d="M -20,250 Q 50,250 100,245 Q 140,242 180,240 L 280,230"
        fill="none" stroke="url(#axonGrad)" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
  <!-- Axon inner glow -->
  <path d="M -20,250 Q 50,250 100,245 Q 140,242 180,240 L 280,230"
        fill="none" stroke="#818cf8" stroke-width="6" stroke-linecap="round" opacity="0.3" filter="url(#softGlow)"/>

  <!-- Axon terminal (bulb) -->
  <ellipse cx="310" cy="228" rx="55" ry="65" fill="url(#axonGrad)" opacity="0.85"/>
  <ellipse cx="310" cy="228" rx="55" ry="65" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
  <!-- Terminal membrane highlight -->
  <path d="M 280,195 Q 310,185 340,200" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity="0.5"/>

  <!-- Vesicles inside axon terminal -->
  <circle cx="295" cy="210" r="10" fill="url(#vesicleGrad)" opacity="0.9"/>
  <circle cx="315" cy="200" r="8" fill="url(#vesicleGrad)" opacity="0.85"/>
  <circle cx="300" cy="235" r="9" fill="url(#vesicleGrad)" opacity="0.8"/>
  <circle cx="325" cy="225" r="7" fill="url(#vesicleGrad)" opacity="0.75"/>
  <circle cx="285" cy="250" r="8" fill="url(#vesicleGrad)" opacity="0.7"/>
  <circle cx="310" cy="255" r="6" fill="url(#vesicleGrad)" opacity="0.65"/>

  <!-- ===== SYNAPTIC CLEFT ===== -->
  <!-- Cleft region glow -->
  <ellipse cx="400" cy="250" rx="80" ry="110" fill="url(#glow)" opacity="0.3"/>

  <!-- Neurotransmitters releasing (diamonds floating across) -->
  <g filter="url(#softGlow)">
    <!-- Top row -->
    <polygon points="370,190 378,182 386,190 378,198" fill="#c4b5fd" opacity="0.9"/>
    <polygon points="395,175 403,167 411,175 403,183" fill="#ddd6fe" opacity="0.85"/>
    <polygon points="420,185 428,177 436,185 428,193" fill="#c4b5fd" opacity="0.8"/>
    <!-- Middle row (main flow) -->
    <polygon points="365,230 373,222 381,230 373,238" fill="#e0d5ff" opacity="0.95" filter="url(#strongGlow)"/>
    <polygon points="390,220 398,212 406,220 398,228" fill="#c4b5fd" opacity="0.9"/>
    <polygon points="415,225 423,217 431,225 423,233" fill="#ddd6fe" opacity="0.85"/>
    <polygon points="440,230 448,222 456,230 448,238" fill="#c4b5fd" opacity="0.8"/>
    <!-- Lower row -->
    <polygon points="375,270 383,262 391,270 383,278" fill="#c4b5fd" opacity="0.8"/>
    <polygon points="400,280 408,272 416,280 408,288" fill="#ddd6fe" opacity="0.75"/>
    <polygon points="430,270 438,262 446,270 438,278" fill="#c4b5fd" opacity="0.7"/>
  </g>

  <!-- Cleft label -->
  <text x="400" y="330" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="500" letter-spacing="3" opacity="0.7">SYNAPTIC CLEFT</text>

  <!-- ===== DENDRITE (receiving side) ===== -->
  <!-- Dendrite membrane -->
  <path d="M 490,190 Q 520,250 490,310"
        fill="none" stroke="url(#dendGrad)" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  <path d="M 490,190 Q 520,250 490,310"
        fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity="0.3" filter="url(#softGlow)"/>

  <!-- Dendrite shaft going right -->
  <path d="M 495,250 Q 560,250 620,248 Q 680,246 820,245"
        fill="none" stroke="url(#dendGrad)" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
  <path d="M 495,250 Q 560,250 620,248 Q 680,246 820,245"
        fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" opacity="0.2" filter="url(#softGlow)"/>

  <!-- Receptors on dendrite (Y-shaped) -->
  <g filter="url(#softGlow)">
    <!-- Receptor 1 -->
    <path d="M 493,210 L 480,195 M 493,210 L 506,195" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <circle cx="493" cy="213" r="5" fill="url(#receptorGrad)" opacity="0.9"/>

    <!-- Receptor 2 -->
    <path d="M 497,250 L 484,237 M 497,250 L 510,237" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <circle cx="497" cy="253" r="5" fill="url(#receptorGrad)" opacity="0.9"/>

    <!-- Receptor 3 -->
    <path d="M 493,290 L 480,278 M 493,290 L 506,278" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <circle cx="493" cy="293" r="5" fill="url(#receptorGrad)" opacity="0.9"/>
  </g>

  <!-- Signal propagation arrows inside dendrite -->
  <g stroke="#2dd4bf" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M 560,245 L 575,245" marker-end="none"/>
    <path d="M 600,245 L 615,245"/>
    <path d="M 640,245 L 655,245"/>
    <path d="M 680,245 L 695,245"/>
  </g>

  <!-- ===== LABELS ===== -->
  <!-- Presynaptic label -->
  <text x="280" y="370" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600" letter-spacing="2">PRESYNAPTIC</text>
  <text x="280" y="388" text-anchor="middle" fill="#7c3aed" font-size="10" opacity="0.7">source files · ψ/ · docs</text>

  <!-- Postsynaptic label -->
  <text x="620" y="370" text-anchor="middle" fill="#2dd4bf" font-size="12" font-weight="600" letter-spacing="2">POSTSYNAPTIC</text>
  <text x="620" y="388" text-anchor="middle" fill="#14b8a6" font-size="10" opacity="0.7">knowledge · search results</text>

  <!-- Synapse label (the framework itself) -->
  <text x="400" y="455" text-anchor="middle" fill="#e0d5ff" font-size="13" font-weight="700" letter-spacing="6" opacity="0.9">SYNAPSE</text>
  <text x="400" y="475" text-anchor="middle" fill="#a78bfa" font-size="9" letter-spacing="2" opacity="0.6">the junction where knowledge connects</text>

  <!-- ===== DATA FLOW ANNOTATIONS ===== -->
  <!-- Left side: input -->
  <text x="80" y="220" fill="#818cf8" font-size="9" opacity="0.6" font-weight="500">INGEST</text>
  <line x1="60" y1="225" x2="60" y2="270" stroke="#818cf8" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>

  <!-- Right side: output -->
  <text x="720" y="220" fill="#22d3ee" font-size="9" opacity="0.6" font-weight="500">RETRIEVE</text>
  <line x1="740" y1="225" x2="740" y2="270" stroke="#22d3ee" stroke-width="1" opacity="0.3" stroke-dasharray="3,3"/>

  <!-- Small tech labels on the cleft -->
  <text x="400" y="165" text-anchor="middle" fill="#c4b5fd" font-size="8" opacity="0.5" letter-spacing="1">LanceDB ▸ FTS5 ▸ RRF</text>

  <!-- Pulse animation circles -->
  <circle cx="395" cy="228" r="4" fill="#c4b5fd" opacity="0.8">
    <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="425" cy="270" r="3" fill="#ddd6fe" opacity="0.7">
    <animate attributeName="r" values="3;7;3" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>