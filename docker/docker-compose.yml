version: "3.9"

# Synapse standalone compose — connects to shared infra-oracle network.
# Prerequisite: infra-oracle docker-compose.yml must be running first
#   (postgres, qdrant, redis, minio, etc.)

networks:
  server-network:
    external: true

services:
  synapse:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: synapse
    restart: unless-stopped
    networks:
      - server-network
    ports:
      - "8420:8420"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    mem_limit: 384m
    depends_on: []
    # Shared infra (postgres, qdrant) is expected to be up already.
