version: "3.8"

services:
  mysynapse:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mysynapse
    restart: unless-stopped
    ports:
      - "8420:8420"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://admin:88888888@postgres:5432/mysynapse}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - API_HOST=0.0.0.0
      - API_PORT=8420
    depends_on:
      - postgres
      - qdrant
    networks:
      - server-network

networks:
  server-network:
    external: true